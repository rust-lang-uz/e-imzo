[package]
name = "e-imzo"
version = "0.4.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "E-IMZO SDK for easier accessing"
homepage = "https://github.com/rust-lang-uz"
repository = "https://github.com/rust-lang-uz/e-imzo"
authors = ["Xinux Dvelopers <support@oss.uzinfocom.uz>"]
readme = "README.md"
keywords = ["e-imzo", "uzbek"]
exclude = [
  "flake.nix",
  "flake.lock",
  ".envrc",
]

# Optimize release binary as much as possible
[profile.release]
lto = true
codegen-units = 1
incremental = true
strip = true
opt-level = "z"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite =  { version = "0.30", features = ["native-tls"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"]}
env_logger = "0.11"
native-tls = "0.2"
url = "2.5.8"
thiserror = "2.0"
locale-rs = "0.3"
